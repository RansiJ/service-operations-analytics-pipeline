name: CI

on:
  push:
    branches: [main, feature/dbt-analytics-layer]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.12.7'
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run --frozen pytest
      - name: Build package and verify bundled SQL outside the checkout environment
        if: runner.os == 'Linux'
        shell: bash
        run: |
          uv build
          uv run --isolated --no-project --with ./dist/service_operations_analytics_pipeline-1.0.0-py3-none-any.whl python -c "from importlib.resources import files; from service_analytics.pipeline import initialize; import duckdb; initialize(duckdb.connect()); assert files('service_analytics').joinpath('transform.sql').is_file()"

  dbt:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.12.7'
          enable-cache: true
      - run: uv sync --frozen --group dbt
      - name: Run all offline regressions and dbt parity scenarios
        run: uv run --frozen --group dbt pytest --junitxml=tmp/dbt-pytest.xml
      - name: Require collected tests and zero skips in the dbt job
        run: >-
          uv run --frozen --group dbt python -c "import sys, xml.etree.ElementTree as ET; suites = list(ET.parse('tmp/dbt-pytest.xml').iter('testsuite')); tests = sum(int(s.get('tests', 0)) for s in suites); skipped = sum(int(s.get('skipped', 0)) for s in suites); print('Collected:', tests, 'Skipped:', skipped); sys.exit(1 if skipped or not tests else 0)"
      - name: Require a fresh POC and no operational database
        run: >-
          uv run --frozen --group dbt python -c "from pathlib import Path; assert not Path('analytics/sandbox/service_requests_poc.duckdb').exists(); assert not Path('data/service_operations.duckdb').exists()"
      - name: Prepare deterministic synthetic database
        run: uv run --frozen --group dbt python -m service_analytics.dbt_poc prepare
      - name: Build isolated models and data tests
        run: >-
          uv run --frozen --group dbt dbt build --project-dir analytics --profiles-dir analytics --vars '{run_id: poc-selected, snapshot_id: poc-fixture-v1}'
      - name: Verify all six outputs and ten original table fingerprints
        run: uv run --frozen --group dbt python -m service_analytics.dbt_poc verify
      - name: Confirm the operational database was never created
        run: >-
          uv run --frozen --group dbt python -c "from pathlib import Path; assert not Path('data/service_operations.duckdb').exists()"
