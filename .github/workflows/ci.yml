name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.12.7'
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run --frozen pytest
      - name: Build package and verify bundled SQL outside the checkout environment
        if: runner.os == 'Linux'
        shell: bash
        run: |
          uv build
          uv run --isolated --no-project --with ./dist/service_operations_analytics_pipeline-1.0.0-py3-none-any.whl python -c "from importlib.resources import files; from service_analytics.pipeline import initialize; import duckdb; initialize(duckdb.connect()); assert files('service_analytics').joinpath('transform.sql').is_file()"
